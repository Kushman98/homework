<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Форма</title>
		<link rel="stylesheet" href="./css/styles.css" />
		<link
			rel="shortcut icon"
			href="./img/favicon-star-image.png"
			type="image/png"
		/>
	</head>
	<body>
		<form class="form">
			<fieldset class="fieldset">
				<h2 class="title-h2">Ваши личные данные</h2>
				<label class="label">
					Ваше имя
					<input
						class="input"
						type="text"
						placeholder="Имя"
						name="first-name"
						required
					/>
				</label>
				<label class="label">
					Ваш возраст
					<input
						class="input"
						type="number"
						inputmode="numeric"
						placeholder="Возраст"
						name="age"
						required
					/>
				</label>
				<label class="label">
					Ваш номер телефона
					<input
						class="input"
						type="tel"
						inputmode="tel"
						placeholder="Номер телефона"
						name="number"
						required
					/>
				</label>
				<label class="label">
					Ваша почта
					<input
						class="input"
						type="email"
						placeholder="Почта"
						name="email"
						required
					/>
				</label>
			</fieldset>
			<fieldset class="fieldset-area">
				<label class="label">
					Сообщение
					<textarea
						class="textarea"
						placeholder="Сообщение"
						name="sms"
						required
					></textarea>
				</label>
				<label class="label">
					<input
						class="checkbox"
						type="checkbox"
						name="consent"
						value="consent"
						required
					/>
					Я принимаю правила
				</label>
				<button class="button">Отправить</button>
			</fieldset>
		</form>
	</body>
</html>
